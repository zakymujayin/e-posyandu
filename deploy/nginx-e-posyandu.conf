# E-Posyandu — Nginx Configuration
# Copy ke: /etc/nginx/sites-available/e-posyandu
# lalu: sudo ln -s /etc/nginx/sites-available/e-posyandu /etc/nginx/sites-enabled/
# lalu: sudo certbot --nginx -d e-posyandu-lebak.duckdns.org

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name e-posyandu-lebak.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name e-posyandu-lebak.duckdns.org;

    # SSL — otomatis oleh certbot
    ssl_certificate /etc/letsencrypt/live/e-posyandu-lebak.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/e-posyandu-lebak.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Root project
    root /home/zhev/e-posyandu;

    # Upload files — served langsung (tidak lewat Next.js)
    location /uploads/ {
        alias /home/zhev/e-posyandu/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # _next/static — cache lama
    location /_next/static/ {
        alias /home/zhev/e-posyandu/.next/static/;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # static files
    location /static/ {
        alias /home/zhev/e-posyandu/public/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Semua request lain → Next.js
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
